# ═══════════════════════════════════════════════════════════
# Netlify configuration — sankarkabi.co.in
# Security headers, redirect rules, build settings
# ═══════════════════════════════════════════════════════════

[build]
  publish = "."

# ──────────────────────────────────────────────────────────
# GLOBAL SECURITY HEADERS — applied to every response
# ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — disallows embedding in any iframe
    X-Frame-Options = "SAMEORIGIN"

    # Stop MIME-type sniffing attacks (e.g. a .jpg served as JS)
    X-Content-Type-Options = "nosniff"

    # Legacy XSS filter for older browsers
    X-XSS-Protection = "1; mode=block"

    # Limit referrer information sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable browser features not needed by this site
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # Force HTTPS for 1 year on this domain and all subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy:
    #   - default-src 'self'          → only load resources from this origin by default
    #   - script-src 'self' 'unsafe-inline' → required: inline protection script + onclick handlers
    #   - style-src with CDN + 'unsafe-inline' → required: Google Fonts, Tabler CDN, inline styles
    #   - font-src → Google Fonts static host + jsDelivr (Tabler icon fonts)
    #   - img-src 'self' data: blob: → all images local; data: for onerror SVG fallbacks
    #   - connect-src 'self' → fetch() calls to /api/search, /api/claude, data/siba.json
    #   - frame-src 'self' → PDF iframes are same-origin
    #   - object-src 'none' → block Flash / <object> embeds
    #   - base-uri 'self' → prevent <base> tag injection that redirects relative URLs
    #   - form-action 'self' → block forms from posting to attacker domains
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# ──────────────────────────────────────────────────────────
# PROTECTED FILES — case study PDFs
# These are still technically accessible at their URL (Netlify
# static files cannot be auth-gated without Netlify Identity or
# a serverless proxy — see RECOMMENDATIONS below).
# These headers prevent search engines from indexing the PDFs
# and force the browser to display rather than offer a download.
# ──────────────────────────────────────────────────────────
[[headers]]
  for = "/images/CaseStudy/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nosniff, noarchive"
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    # inline forces browser to render in-tab rather than download dialog
    Content-Disposition = "inline"

[[headers]]
  for = "/images/CaseStudy/*.png"
  [headers.values]
    X-Robots-Tag = "noindex, noarchive"
    Cache-Control = "no-store, private"

[[headers]]
  for = "/images/CaseStudy/*.jpg"
  [headers.values]
    X-Robots-Tag = "noindex, noarchive"
    Cache-Control = "no-store, private"

# Resume DOCX — allow download, keep unindexed
[[headers]]
  for = "/images/UX_Siba_Sankar_Kabi_Resume.docx"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
    Content-Disposition = "attachment; filename=\"Siba_Sankar_Kabi_Resume.docx\""

# Prevent the data file from being indexed
[[headers]]
  for = "/data/siba.json"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"

# ──────────────────────────────────────────────────────────
# REDIRECTS — block backup/sensitive files, unify old URLs
# ──────────────────────────────────────────────────────────
[[redirects]]
  # Backup data file — should never be publicly reachable
  from = "/data/previoussiba.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  # Old main.js backup — exposes previous implementation logic
  from = "/js/previousmain.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  # Old AI portfolio version — redirect to main
  from = "/AIindex.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  # Old AI subfolder — redirect to main
  from = "/AI/*"
  to = "/"
  status = 301
  force = true
